<div id="sharedLinkGate" class="fixed inset-0 z-50 bg-base-200 flex items-center justify-center p-4">
  <div class="w-full max-w-sm">
    <!-- Loading state -->
    <div id="gateLoading" class="card bg-base-100 shadow-lg animate-fade-in-up">
      <div class="card-body items-center text-center py-10">
        <span class="loading loading-spinner loading-lg text-primary"></span>
        <h2 class="card-title justify-center text-lg mt-4">Joining conference…</h2>
        <p class="text-sm opacity-60">Connecting to the shared link</p>
      </div>
    </div>

    <!-- Password form state -->
    <div id="gatePassword" class="card bg-base-100 shadow-lg animate-fade-in-up hidden">
      <div class="card-body items-center text-center">
        <div class="w-14 h-14 rounded-2xl bg-primary/10 flex items-center justify-center mb-2">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            class="w-7 h-7 text-primary">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
              d="M16.5 10.5V6.75a2.25 2.25 0 0 0-2.25-2.25h-6a2.25 2.25 0 0 0-2.25 2.25v3.75m-.75 11.25h10.5a2.25 2.25 0 0 0 2.25-2.25v-6.75a2.25 2.25 0 0 0-2.25-2.25H6.75a2.25 2.25 0 0 0-2.25 2.25v6.75a2.25 2.25 0 0 0 2.25 2.25Z" />
          </svg>
        </div>
        <h2 class="card-title justify-center text-xl">Password required</h2>
        <p class="text-sm opacity-60 -mt-1">Enter the password to join this conference</p>

        <form id="sharedLinkPasswordForm" class="w-full space-y-4 mt-2" action="#" method="post" novalidate>
          <div class="form-control">
            <label class="label pb-1" for="sharedLinkPasswordInput">
              <span class="label-text font-medium">Password</span>
            </label>
            <input id="sharedLinkPasswordInput" name="password" type="password" required placeholder="••••••••"
              autocomplete="current-password" class="input input-bordered w-full" />
          </div>

          <div id="sharedLinkPasswordError" class="hidden alert alert-error text-sm py-2" role="alert"></div>

          <button type="submit" id="sharedLinkPasswordSubmitBtn" class="btn btn-primary w-full">
            <span class="loading loading-spinner loading-sm hidden" id="sharedLinkPasswordSpinner"></span>
            <span id="sharedLinkPasswordBtnLabel">Join</span>
          </button>
        </form>
      </div>
    </div>

    <!-- Error state -->
    <div id="gateError" class="card bg-base-100 shadow-lg animate-fade-in-up hidden">
      <div class="card-body items-center text-center py-10">
        <div class="w-14 h-14 rounded-2xl bg-error/10 flex items-center justify-center mb-2">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            class="w-7 h-7 text-error">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
              d="M12 9v3.75m9-.75a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9 3.75h.008v.008H12v-.008Z" />
          </svg>
        </div>
        <h2 class="card-title justify-center text-lg">Unable to join</h2>
        <p id="gateErrorMessage" class="text-sm opacity-60">Something went wrong. Please try again.</p>
        <button id="gateRetryBtn" class="btn btn-primary btn-sm mt-2">Try again</button>
      </div>
    </div>
  </div>
</div>

<div class="min-h-screen bg-base-200">
  <div class="mx-auto p-4 max-w-screen-lg w-full pb-36 sm:pb-28">
    <div class="relative z-10 flex items-center justify-end gap-4 mb-4">
      <button id="btnAddParticipant" class="btn btn-sm btn-primary">Add participant</button>
    </div>

    <div class="relative mb-4">
      <video id="localVideo"
        class="fixed z-10 w-40 h-28 md:w-64 md:h-40 rounded-box border border-base-300 shadow-lg object-cover bg-black cursor-move touch-none select-none left-4"
        autoplay playsinline muted></video>
    </div>

    <div id="remotesGrid" class="grid grid-cols-2 gap-4">
    </div>
  </div>
</div>

<div id="controlDock" class="fixed inset-x-0 bottom-0 z-20">
  <div class="mx-auto max-w-screen-md px-4 pb-6" style="padding-bottom: max(1.5rem, env(safe-area-inset-bottom))">
    <div class="navbar min-h-14 bg-base-100/90 backdrop-blur rounded-2xl shadow-xl">
      <div class="mx-auto flex items-center justify-center gap-3 py-2">
        <button id="btnToggleCamera" class="btn btn-ghost btn-circle btn-lg" aria-pressed="false"
          aria-label="Toggle camera">
          <svg id="iconCamOn" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            class="w-6 h-6 hidden">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
              d="M15.75 10.5V6.75A2.25 2.25 0 0 0 13.5 4.5h-9A2.25 2.25 0 0 0 2.25 6.75v10.5A2.25 2.25 0 0 0 4.5 19.5h9a2.25 2.25 0 0 0 2.25-2.25V13.5l4.03 2.69a.75.75 0 0 0 1.17-.62V8.43a.75.75 0 0 0-1.17-.62L15.75 10.5Z" />
          </svg>
          <svg id="iconCamOff" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            class="w-6 h-6">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
              d="M3 3l18 18M15.75 10.5V6.75A2.25 2.25 0 0 0 13.5 4.5h-6M5.25 6.75H4.5A2.25 2.25 0 0 0 2.25 9v6A2.25 2.25 0 0 0 4.5 17.25h8.25a2.25 2.25 0 0 0 2.25-2.25V13.5l3.53 2.36c.5.34 1.17-.02 1.17-.62V8.56c0-.6-.67-.96-1.17-.62L18 9.75M9 9l6 6" />
          </svg>
        </button>
        <button id="btnToggleMic" class="btn btn-ghost btn-circle btn-lg" aria-pressed="true"
          aria-label="Toggle microphone">
          <svg id="iconMicOn" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            class="w-6 h-6">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
              d="M12 3.75A3.75 3.75 0 0 1 15.75 7.5v3A3.75 3.75 0 0 1 12 14.25 3.75 3.75 0 0 1 8.25 10.5v-3A3.75 3.75 0 0 1 12 3.75Z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
              d="M5.25 10.5A6.75 6.75 0 0 0 12 17.25 6.75 6.75 0 0 0 18.75 10.5M12 17.25V21" />
          </svg>
          <svg id="iconMicOff" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            class="w-6 h-6 hidden">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
              d="M3 3l18 18M15.75 10.5v-3A3.75 3.75 0 0 0 12 3.75c-.87 0-1.67.3-2.3.81M8.25 10.5v0A3.75 3.75 0 0 0 12 14.25c.65 0 1.26-.16 1.8-.44M5.25 10.5A6.75 6.75 0 0 0 12 17.25 6.75 6.75 0 0 0 18.75 10.5M12 17.25V21" />
          </svg>
        </button>
        <button id="btnHangup" class="btn btn-error btn-circle btn-xl" aria-label="Hang up">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" class="w-6 h-6">
            <g transform="rotate(180 12 12)">
              <path
                d="M22 16.92v3a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.12.9.32 1.77.59 2.61a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.47-1.16a2 2 0 0 1 2.11-.45c.84.27 1.71.47 2.61.59A2 2 0 0 1 22 16.92z" />
            </g>
          </svg>
        </button>
      </div>
    </div>
  </div>
</div>
<div class="sr-only" aria-live="polite" id="ariaStatus"></div>
