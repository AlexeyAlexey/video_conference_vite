<div class="min-h-screen bg-base-200">
  <div class="mx-auto p-4 max-w-screen-lg w-full">
    <div id="navigationBar"></div>

    <div class="flex items-center justify-between gap-3 mb-3 animate-fade-in-up">
      <div>
        <h1 class="text-xl font-semibold">Contacts</h1>
        <p class="text-sm opacity-60" id="phonesCount">Loading…</p>
      </div>
    </div>

    <div class="relative mb-3 animate-fade-in-up" style="animation-delay: 40ms">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round"
        class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 opacity-40 pointer-events-none">
        <circle cx="11" cy="11" r="8"></circle>
        <path d="m21 21-4.35-4.35"></path>
      </svg>
      <input id="phonesSearch" type="search" placeholder="Search contacts…" class="input input-bordered w-full pl-9"
        aria-label="Search contacts" />
    </div>

    <div class="card bg-base-100 shadow w-full animate-fade-in-up" style="animation-delay: 80ms">
      <div class="card-body py-2">
        <div id="phonesLoading" class="flex items-center gap-3 py-6 opacity-60">
          <span class="loading loading-spinner loading-sm"></span>
          <span class="text-sm">Loading contacts…</span>
        </div>

        <div id="phonesEmpty" class="hidden flex-col items-center text-center py-10 gap-3">
          <div class="w-14 h-14 rounded-full bg-base-200 flex items-center justify-center">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="w-7 h-7 opacity-50">
              <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
              <circle cx="9" cy="7" r="4" />
              <path d="M22 21v-2a4 4 0 0 0-3-3.87" />
              <path d="M16 3.13a4 4 0 0 1 0 7.75" />
            </svg>
          </div>
          <div>
            <p class="font-medium" id="phonesEmptyTitle">No contacts yet</p>
            <p class="text-sm opacity-60" id="phonesEmptyText">Add a contact from the menu to start calling.</p>
          </div>
        </div>

        <ul id="phones-list" class="list w-full stagger-in">
        </ul>
      </div>
    </div>
  </div>
</div>
