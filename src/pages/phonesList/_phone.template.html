<li id="${props.phone}" data-id="${props.id}"
  class="list-row flex items-center hover:bg-base-200 focus:bg-base-200 active:bg-base-200 cursor-pointer transition-colors rounded-box select-none relative overflow-hidden"
  tabindex="0" role="button" onclick="void 0">
  <div class="swipe-content-wrapper relative z-10 flex items-center w-full min-w-0">
    <div class="avatar placeholder">
      <div class="bg-primary/10 text-primary rounded-full w-10">
        <span class="text-sm font-semibold">${(props.name || '?').trim().charAt(0).toUpperCase()}</span>
      </div>
    </div>
    <div class="flex flex-col min-w-0">
      <span class="font-medium truncate">${props.name}</span>
      <span class="text-xs opacity-60">${props.phone}</span>
    </div>
    <button data-host-id=${props.hostId} data-phone="${props.phone}"
      class="call-button btn btn-success btn-circle btn-sm ml-auto" aria-label="Call ${props.name}">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4">
        <path
          d="M22 16.92v3a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.12.9.32 1.77.59 2.61a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.47-1.16a2 2 0 0 1 2.11-.45c.84.27 1.71.47 2.61.59A2 2 0 0 1 22 16.92z" />
      </svg>
    </button>
  </div>
  <div
    class="swipe-bg absolute right-0 top-0 bottom-0 flex items-center justify-end pr-4 bg-error text-error-content opacity-0 transition-opacity duration-200 pointer-events-none"
    style="width:80px;">
    <button class="swipe-remove-btn btn btn-circle btn-sm" aria-label="Remove ${props.name}">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4">
        <path d="M3 6h18"></path>
        <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
        <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path>
        <path d="M10 11v6"></path>
        <path d="M14 11v6"></path>
      </svg>
    </button>
  </div>
</li>
