<div class="min-h-screen bg-base-200">
  <div id="callStage" class="relative w-full h-[100svh] overflow-hidden bg-black">
    <video id="remoteVideo" class="w-full h-full object-cover" autoplay playsinline muted></video>

    <video id="localVideo"
      class="absolute z-10 w-40 h-28 md:w-64 md:h-40 rounded-xl border-2 border-white/20 shadow-2xl object-cover bg-black cursor-move touch-none select-none"
      autoplay playsinline muted></video>

    <!-- Caller info + timer -->
    <div class="absolute top-0 inset-x-0 z-10 p-4 pointer-events-none">
      <div class="flex items-center gap-3 max-w-screen-md mx-auto">
        <div class="flex items-center gap-2 bg-black/50 backdrop-blur rounded-full pl-2 pr-4 py-2 text-white shadow-lg">
          <span class="relative flex w-2.5 h-2.5">
            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-success opacity-75"></span>
            <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-success"></span>
          </span>
          <div class="flex flex-col leading-tight">
            <span id="callTimer" class="text-sm font-medium tabular-nums">00:00</span>
            <span id="callStatus" class="text-[11px] opacity-70">Connecting…</span>
          </div>
        </div>
      </div>
    </div>

    <div class="fixed inset-x-0 bottom-0 z-10">
      <div class="mx-auto max-w-screen-md px-4 pb-6" style="padding-bottom: max(1.5rem, env(safe-area-inset-bottom))">
        <div id="controlBar" class="navbar min-h-14 bg-base-100/90 backdrop-blur rounded-2xl shadow-xl">
          <div class="mx-auto flex items-center justify-center gap-3 py-2">
            <button id="audioToggleBtn" aria-label="Toggle microphone" class="btn btn-ghost btn-circle btn-lg">
              <span id="previewAudioIconOn" aria-hidden="true">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                  stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5">
                  <path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3z"></path>
                  <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                  <path d="M12 19v2"></path>
                </svg>
              </span>
              <span id="previewAudioIconOff" class="hidden" aria-hidden="true">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                  stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5">
                  <path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3z"></path>
                  <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                  <path d="M12 19v2"></path>
                  <path d="M2 2l20 20"></path>
                </svg>
              </span>
            </button>

            <button id="end-call" aria-label="End call" class="btn btn-error btn-circle btn-xl">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-6 h-6">
                <g transform="rotate(180 12 12)">
                  <path
                    d="M22 16.92v3a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.12.9.32 1.77.59 2.61a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.47-1.16a2 2 0 0 1 2.11-.45c.84.27 1.71.47 2.61.59A2 2 0 0 1 22 16.92z" />
                </g>
              </svg>
            </button>

            <button id="videoToggleBtn" aria-label="Toggle camera" class="btn btn-ghost btn-circle btn-lg">
              <span id="previewVideoIconOn" class="hidden" aria-hidden="true">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                  stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5">
                  <rect x="3" y="7" width="12" height="10" rx="2" ry="2"></rect>
                  <path d="M21 7l-6 4v2l6 4V7z"></path>
                </svg>
              </span>
              <span id="previewVideoIconOff" aria-hidden="true">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                  stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5">
                  <rect x="3" y="7" width="12" height="10" rx="2" ry="2"></rect>
                  <path d="M21 7l-6 4v2l6 4V7z"></path>
                  <path d="M2 2l20 20"></path>
                </svg>
              </span>
            </button>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>
