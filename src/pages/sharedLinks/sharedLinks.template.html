<div class="min-h-screen bg-base-200">
  <div class="mx-auto p-4 max-w-screen-lg w-full">
    <div id="navigationBar"></div>

    <div class="flex items-center justify-between gap-3 mb-3 animate-fade-in-up">
      <div>
        <h1 class="text-xl font-semibold">Shared links</h1>
        <p class="text-sm opacity-60" id="sharedLinksCount">Loading…</p>
      </div>
    </div>

    <div class="card bg-base-100 shadow w-full animate-fade-in-up" style="animation-delay: 60ms">
      <div class="card-body py-2">
        <div id="sharedLinksLoading" class="flex items-center gap-3 py-6 opacity-60">
          <span class="loading loading-spinner loading-sm"></span>
          <span class="text-sm">Loading shared links…</span>
        </div>

        <div id="sharedLinksEmpty" class="hidden flex-col items-center text-center py-10 gap-3">
          <div class="w-14 h-14 rounded-full bg-base-200 flex items-center justify-center">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="w-7 h-7 opacity-50">
              <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" />
              <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" />
            </svg>
          </div>
          <div>
            <p class="font-medium">No shared links yet</p>
            <p class="text-sm opacity-60">Create a link from the menu to share a conference.</p>
          </div>
        </div>

        <ul id="sharesLinksList" class="list w-full stagger-in"></ul>
      </div>
    </div>
  </div>
</div>
