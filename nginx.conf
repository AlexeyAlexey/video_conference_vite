# WebSocket upgrade handling (Phoenix socket proxied below).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# video_conference backend, reachable via Docker DNS.
upstream video_conference_backend {
    server video_conference:80;
}

server {
    listen 8080;
    listen [::]:8080;
    listen 8443 ssl;
    listen [::]:8443 ssl;

    # Self-signed cert for HTTPS (mounted from ./certs)
    ssl_certificate /certs/frontend.crt;
    ssl_certificate_key /certs/frontend.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    server_name _;

    # gzip for static assets
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # --- API + websockets: proxy to the video_conference backend -----------
    # The browser talks to a single origin (this server); nginx forwards the
    # API and Phoenix socket paths to the backend (avoids mixed-content and
    # the need to trust a second self-signed cert).
    location ~ ^/(phones|phone_book|shared_link|conference|socket|live)(/|$) {
        proxy_pass http://video_conference_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        # Single-page app: unknown paths fall back to index.html
        try_files $uri $uri/ /index.html;
    }

    # Long-lived cache for fingerprinted assets
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
